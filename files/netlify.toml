[build]
  publish = "."

# Netlify serves everything over HTTPS automatically — that's what lets
# getUserMedia() (camera) and getCurrentPosition() (location) work on other
# people's phones/laptops, not just localhost. These headers just make sure
# nothing accidentally blocks those two permissions for this site itself.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    X-Content-Type-Options = "nosniff"

# Don't let browsers cache config.js / index.html so a re-deploy or edited
# Supabase key always takes effect immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
